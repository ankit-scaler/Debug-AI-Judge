<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preview</title>
    <!--
      The learner's bundle is imported as a blob module. Blob modules resolve bare
      specifiers against THIS document's import map, which is why the map lives
      here. Paths must match what scripts/build-preview-vendor.mjs produces; that
      script asserts they do.
    -->
    <script type="importmap">
      {
        "imports": {
          "react": "./vendor/react.js",
          "react/jsx-runtime": "./vendor/jsx-runtime.js",
          "react-dom/client": "./vendor/react-dom-client.js",
          "react-dom": "./vendor/react-dom-client.js"
        }
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, sans-serif;
        background: #fff;
        color: #111;
      }
      #debuglab-crash {
        display: none;
        margin: 16px;
        padding: 12px 14px;
        border: 1px solid #ef4444;
        border-radius: 6px;
        background: #fef2f2;
        color: #991b1b;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        white-space: pre-wrap;
      }
    </style>
    <!--
      The question's own CSS goes here, set by the 'run' handler below. Kept
      as a separate, always-present element (rather than injecting/removing a
      new <style> each run) so there is one place to replace, never a stack
      of stale rules from a previous run competing with the current ones.
    -->
    <style id="debuglab-question-css"></style>
  </head>
  <body>
    <div id="root"></div>
    <pre id="debuglab-crash"></pre>
    <script>
      (function () {
        // This same file is used two ways: embedded in a sandboxed iframe
        // (where `parent` is the host page), and popped out into its own
        // real browser tab via window.open() (where there is no parent --
        // `window.parent` is just this window itself -- but `window.opener`
        // points back to the tab that opened it). Picking whichever target
        // actually exists lets one file serve both.
        function post(type, payload) {
          try {
            var target = window.opener && !window.opener.closed ? window.opener : parent;
            target.postMessage({ source: 'debuglab-preview', type: type, payload: payload }, '*');
          } catch (e) {
            /* target gone */
          }
        }

        function format(value) {
          if (typeof value === 'string') return value;
          if (value instanceof Error) return value.stack || value.message;
          try {
            return JSON.stringify(value);
          } catch (e) {
            return String(value);
          }
        }

        // Forward the preview's console to the host's Console panel. The original
        // is still called so the real devtools keep working too.
        ['log', 'info', 'warn', 'error', 'debug'].forEach(function (level) {
          var original = console[level] ? console[level].bind(console) : function () {};
          console[level] = function () {
            var args = Array.prototype.slice.call(arguments);
            original.apply(null, args);
            post('console', { level: level, text: args.map(format).join(' ') });
          };
        });

        var crash = document.getElementById('debuglab-crash');
        var questionCss = document.getElementById('debuglab-question-css');
        function showCrash(text) {
          crash.textContent = text;
          crash.style.display = 'block';
        }

        window.addEventListener('error', function (event) {
          var text = (event.error && event.error.stack) || event.message;
          showCrash(text);
          post('error', { text: text });
        });
        window.addEventListener('unhandledrejection', function (event) {
          var text = format(event.reason);
          showCrash(text);
          post('error', { text: text });
        });

        var previousScript = null;

        window.addEventListener('message', function (event) {
          var data = event.data;
          if (!data || data.source !== 'debuglab-host') return;
          if (data.type !== 'run') return;

          crash.style.display = 'none';
          crash.textContent = '';
          document.getElementById('root').innerHTML = '';
          // esbuild emits a question's CSS imports as separate text from the
          // JS, not inlined into it -- see src/preview/bundler.ts. Replacing
          // (not appending) means switching between a styled fix and the
          // unstyled original, or hitting Reset, never leaves a previous
          // run's rules still in effect alongside the current ones.
          questionCss.textContent = data.css || '';

          // Inline module script text, not a blob: URL passed to import().
          // This document is a sandboxed iframe with an opaque origin (no
          // allow-same-origin, deliberately -- it must not be able to reach the
          // parent page). Dynamic import() of a blob: URL is unreliable from an
          // opaque-origin document in Chromium; an inline <script type="module">
          // has no such fetch step for its own top-level text, so it sidesteps
          // the problem entirely. Its nested imports (react, react-dom/client)
          // still resolve through the import map above and are fetched as real
          // HTTP requests -- see next.config.ts for the CORS headers those need,
          // since an opaque-origin document's fetches are treated as
          // cross-origin even to same-host URLs.
          if (previousScript) previousScript.remove();
          var script = document.createElement('script');
          script.type = 'module';
          script.textContent = data.code;
          document.body.appendChild(script);
          previousScript = script;

          post('ran', {});
        });

        post('frame-ready', {});
      })();
    </script>
  </body>
</html>
